<!DOCTYPE html>
<html lang="en">

<head>
    <title>Feedback Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            background-color: #ffffff;
            max-width: 550px;
            margin: 20px auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        div {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            color: #555;
            font-size: 15px;
            display: inline-block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Segoe UI', Arial, sans-serif;
            resize: vertical;
            min-height: 120px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #2196F3;
            outline: none;
            box-shadow: 0 0 5px rgba(33, 150, 243, 0.3);
        }

        input[type="radio"] {
            margin-right: 5px;
        }

        button[type="submit"] {
            background-color: #2196F3;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        button[type="submit"]:hover {
            background-color: #1976D2;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <h1>Feedback Form</h1>
    <form>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" required>
        </div>
        <br>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" required>
        </div>
        <br>

        <div>
            <label for="message">Feedback Message:</label><br>
            <textarea id="message" rows="5" cols="40" placeholder="Please type your feedback here..."
                required></textarea>
        </div>
        <br>

        <div>
            <label>How satisfied are you?</label><br>
            <input type="radio" id="satisfied" value="satisfied" required>
            <label for="satisfied">Satisfied</label>
            <br>
            <input type="radio" id="neutral" value="neutral">
            <label for="neutral">Neutral</label>
            <br>
            <input type="radio" id="unsatisfied" value="unsatisfied">
            <label for="unsatisfied">Unsatisfied</label>
        </div>
        <br>

        <button type="submit">Submit Feedback</button>
    </form>
</body>

</html>
