<!DOCTYPE html>
<html lang="en">

<head>
    <title>Feedback Form</title>
</head>

<body>
    <h1>Feedback Form</h1>
    <form>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" required>
        </div>
        <br>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email"  required>
        </div>
        <br>

        <div>
            <label for="message">Feedback Message:</label><br>
            <textarea id="message" rows="5" cols="40" placeholder="Please type your feedback here..."
                required></textarea>
        </div>
        <br>

        <div>
            <label>How satisfied are you?</label><br>
            <input type="radio" id="satisfied"  value="satisfied" required>
            <label for="satisfied">Satisfied</label>
            <br>
            <input type="radio" id="neutral" value="neutral">
            <label for="neutral">Neutral</label>
            <br>
            <input type="radio" id="unsatisfied" value="unsatisfied">
            <label for="unsatisfied">Unsatisfied</label>
        </div>
        <br>

        <button type="submit">Submit Feedback</button>
    </form>
</body>

</html>
