<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container{
            margin: auto;
            width: 30%;
        }

        form {
            width: 300px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <center>
        <h2>Login</h2>
     <form>
        <label>Username</label>
        <input type="text" placeholder="Username">

        <label>Password</label>
        <input type="password" placeholder="Password">

        <button type="button">Login</button>
     </form>

    </center>

    

</body>

</html>
