<!DOCTYPE html>
<html lang="en">

<head>
    <title>Basic Webpage Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex: 1;
           
        }

        aside {
            background-color: #d4cfcf;
            width: 25%;
            padding: 20px;
            border-right: 1px solid #ccc;
        }

        main {
            background-color: #fff;
            flex: 1;
            padding: 20px;
        }

    </style>
</head>

<body>

    <header>
        <h1>My Website Header</h1>
    </header>

    <div class="container">
        <aside>
            <h2>Sidebar</h2>
            <p>Links or info go here.</p>
        </aside>

        <main>
            <h2>Main Content</h2>
            <p>This is the main area of the webpage. The sidebar is to the left.</p>
        </main>
    </div>

</body>

</html>
